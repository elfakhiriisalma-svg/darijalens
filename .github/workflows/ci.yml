name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r apps/api/requirements-dev.txt

      - name: Vérifier le style du code (ruff)
        run: ruff check .

      - name: Lancer les tests (pytest)
        run: pytest
